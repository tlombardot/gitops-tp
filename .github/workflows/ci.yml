# Le pipeline de CircuitCourt. Pour l'instant, il ne fait que lancer les tests.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  # TODO TP 1 : lancer aussi le pipeline sur chaque pull request (pull_request:)
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # TODO TP 2 : npm run test:coverage, pour que le pipeline échoue sous les seuils de couverture
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run gitleaks
      - run: npm audit --omit=dev --audit-level=high
      - name: Snyk (only if the SNYK_TOKEN secret exists)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@v1.0.0
        with:
          args: --severity-threshold=high
      - run: npm run build
      - name: Start the application
        run: |
          npm start &
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent http://localhost:3000/health
      - name: Mozilla Observatory (60/100 at least, grade C+)
        run: npm run observatory -- circuitcourt.localhost:3000 60
      - uses: actions/upload-artifact@v7
        with:
          name: circuitcourt
          path: |
            dist
            public
            package.json
