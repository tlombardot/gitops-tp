# Construire l'image Docker et la publier dans le registre de GitHub (TP 4).
name: Delivery

on:
  # TODO TP 4 : à chaque push sur main, sauf quand seul le dossier deploy/ change :
  push:
    branches: [main]
    paths-ignore: ["deploy/**"]
  workflow_dispatch:

permissions:
  contents: read
  # TODO TP 4 : le droit de publier l'image dans le registre de GitHub (packages: write)
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/circuitcourt
          # TODO TP 4 : « latest » ne dit pas quelle version tourne. Un tag par commit : type=sha,prefix=sha-
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
