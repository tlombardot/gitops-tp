# Le pipeline de CircuitCourt. Pour l'instant, il ne fait que lancer les tests.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - *.md
  # TODO TP 1 : lancer aussi le pipeline sur chaque pull request (pull_request:)
  pull_request:
    paths-ignore:
      - docs/**
      - *.md
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # TODO TP 2 : npm run test:coverage, pour que le pipeline échoue sous les seuils de couverture
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: circuitcourt
          path: |
            dist
            public
            package.json
